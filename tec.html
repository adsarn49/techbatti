<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அலுவலக பணி கண்காணிப்பு செயலி</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --radius: 16px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea, button {
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-card {
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            border-left: 6px solid var(--secondary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .task-card.pending { border-left-color: var(--warning); }
        .task-card.in-progress { border-left-color: var(--primary); }
        .task-card.completed { border-left-color: var(--success); }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 18px;
            font-weight: 700;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            font-weight: 600;
        }

        .badge-pending { background-color: var(--warning); }
        .badge-in-progress { background-color: var(--primary); }
        .badge-completed { background-color: var(--success); }

        .media-preview {
            margin-top: 10px;
            max-width: 100%;
            max-height: 250px;
            border-radius: var(--radius-sm);
            display: block;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Section -->
    <div id="auth-section" class="card">
        <h2 id="auth-mode-title">பணியாளர் உள்நுழைவு</h2>
        <form id="auth-form">
            <label for="username">பெயர்:</label>
            <input type="text" id="username" placeholder="உங்கள் பெயரை உள்ளிடவும்" required>
            
            <label for="password">கடவுச்சொல்:</label>
            <input type="password" id="password" placeholder="கடவுச்சொல்லை உள்ளிடவும்" required>
            
            <button type="submit" id="auth-submit-btn">உள்நுழைய</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a href="#" id="toggle-auth-mode" style="color: var(--primary); text-decoration: none;">புதிய பயனரா? பதிவு செய்யவும்</a>
        </p>
    </div>

    <!-- App Section -->
    <div id="app-section" style="display: none;">
        <div class="card">
            <h1>பணி கண்காணிப்பு பலகை</h1>
            <div class="user-info">
                <span>பயனர்: <b id="current-user-display"></b> <span id="admin-badge" style="background: var(--primary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; display:none;">Admin</span></span>
                <button onclick="logout()" style="padding: 6px 12px; font-size: 13px; background-color: var(--danger);">வெளியேற</button>
            </div>
            
            <form id="task-form">
                <h3 style="margin: 0; color: var(--primary);">புதிய பணியைச் சேர்க்கவும் / புதுப்பிக்கவும்</h3>
                <input type="hidden" id="task-id-input">
                
                <label for="task-title-input">பணியின் பெயர்:</label>
                <input type="text" id="task-title-input" required>
                
                <label for="task-desc-input">விவரம்:</label>
                <textarea id="task-desc-input" rows="3" required></textarea>
                
                <label for="task-status-input">நிலை:</label>
                <select id="task-status-input">
                    <option value="pending">நிலுவையில் உள்ளது</option>
                    <option value="in-progress">நடைபெறுகிறது</option>
                    <option value="completed">முடிவடைந்தது</option>
                </select>

                <label for="task-media-input">ஆதாரம் (புகைப்படம், வீடியோ, PDF, Word, Excel, PPT):</label>
                <input type="file" id="task-media-input" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx">

                <button type="submit" id="save-task-btn">பதியவும்</button>
            </form>
        </div>

        <h2>பணிகளின் பட்டியல்</h2>
        <div id="task-list" class="task-list"></div>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('office_users')) || {};
    let currentUser = localStorage.getItem('office_user') ? localStorage.getItem('office_user').toLowerCase() : null;
    let tasks = JSON.parse(localStorage.getItem('office_tasks')) || [];
    let isRegisterMode = false;

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authForm = document.getElementById('auth-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const toggleAuthMode = document.getElementById('toggle-auth-mode');
    const authModeTitle = document.getElementById('auth-mode-title');
    const currentUserDisplay = document.getElementById('current-user-display');
    const adminBadge = document.getElementById('admin-badge');
    const taskForm = document.getElementById('task-form');
    const taskList = document.getElementById('task-list');

    if (currentUser) {
        showApp();
    }

    toggleAuthMode.addEventListener('click', (e) => {
        e.preventDefault();
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            authModeTitle.textContent = 'பணியாளர் பதிவு';
            authSubmitBtn.textContent = 'பதிவு செய்யவும்';
            toggleAuthMode.textContent = 'ஏற்கனவே கணக்கு உள்ளதா? உள்நுழையவும்';
        } else {
            authModeTitle.textContent = 'பணியாளர் உள்நுழைவு';
            authSubmitBtn.textContent = 'உள்நுழைய';
            toggleAuthMode.textContent = 'புதிய பயனரா? பதிவு செய்யவும்';
        }
    });

    authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (isRegisterMode) {
            if (users[username]) {
                alert('இந்தப் பெயர் ஏற்கனவே உள்ளது. தயவுசெய்து உள்நுழையவும்.');
                return;
            }
            users[username] = password;
            localStorage.setItem('office_users', JSON.stringify(users));
            alert('பதிவு வெற்றிகரமாக முடிந்தது! இப்போது உள்நுழையலாம்.');
            toggleAuthMode.click();
            usernameInput.value = '';
            passwordInput.value = '';
        } else {
            if (!users[username] || users[username] !== password) {
                alert('தவறான பெயர் அல்லது கடவுச்சொல்.');
                return;
            }
            currentUser = username;
            localStorage.setItem('office_user', currentUser);
            showApp();
        }
    });

    function showApp() {
        authSection.style.display = 'none';
        appSection.style.display = 'block';
        currentUserDisplay.textContent = currentUser;
        
        // Kangeswaran எனில் அட்மின் சலுகை வழங்கப்படும்
        if (currentUser === 'kangeswaran') {
            adminBadge.style.display = 'inline-block';
        } else {
            adminBadge.style.display = 'none';
        }
        renderTasks();
    }

    function logout() {
        localStorage.removeItem('office_user');
        currentUser = null;
        authSection.style.display = 'block';
        appSection.style.display = 'none';
        usernameInput.value = '';
        passwordInput.value = '';
    }

    taskForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const idInput = document.getElementById('task-id-input').value;
        const title = document.getElementById('task-title-input').value;
        const desc = document.getElementById('task-desc-input').value;
        const status = document.getElementById('task-status-input').value;
        const mediaInput = document.getElementById('task-media-input');
        
        let mediaUrl = '';
        let fileName = '';
        let fileType = '';

        if (mediaInput.files && mediaInput.files[0]) {
            const file = mediaInput.files[0];
            mediaUrl = await convertBase64(file);
            fileName = file.name;
            fileType = file.type;
        }

        if (idInput) {
            const task = tasks.find(t => t.id == idInput);
            if (task && (task.user === currentUser || currentUser === 'kangeswaran')) {
                task.title = title;
                task.desc = desc;
                task.status = status;
                if (mediaUrl) {
                    task.mediaUrl = mediaUrl;
                    task.fileName = fileName;
                    task.fileType = fileType;
                }
                task.date = new Date().toLocaleString() + ' (Updated)';
            }
        } else {
            const newTask = {
                id: Date.now(),
                user: currentUser,
                title,
                desc,
                status,
                mediaUrl,
                fileName,
                fileType,
                date: new Date().toLocaleString()
            };
            tasks.unshift(newTask);
        }

        localStorage.setItem('office_tasks', JSON.stringify(tasks));
        taskForm.reset();
        document.getElementById('task-id-input').value = '';
        document.getElementById('save-task-btn').textContent = 'பதியவும்';
        renderTasks();
    });

    function convertBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function editTask(id) {
        const task = tasks.find(t => t.id == id);
        if (task) {
            document.getElementById('task-id-input').value = task.id;
            document.getElementById('task-title-input').value = task.title;
            document.getElementById('task-desc-input').value = task.desc;
            document.getElementById('task-status-input').value = task.status;
            document.getElementById('save-task-btn').textContent = 'புதுப்பிக்கவும்';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function renderTasks() {
        taskList.innerHTML = '';
        
        let filteredTasks = tasks;
        if (currentUser !== 'kangeswaran') {
            filteredTasks = tasks.filter(task => task.user === currentUser);
        }

        if (filteredTasks.length === 0) {
            taskList.innerHTML = '<p style="text-align: center; color: var(--secondary);">பதிவுகள் எதுவும் இல்லை.</p>';
            return;
        }

        filteredTasks.forEach(task => {
            const card = document.createElement('div');
            card.className = `task-card ${task.status}`;
            
            let badgeText = 'நிலுவையில்';
            if (task.status === 'in-progress') badgeText = 'நடைபெறுகிறது';
            if (task.status === 'completed') badgeText = 'முடிவடைந்தது';

            let mediaHtml = '';
            if (task.mediaUrl) {
                if (task.fileType.startsWith('image/')) {
                    mediaHtml = `<img src="${task.mediaUrl}" class="media-preview" alt="ஆதாரம்">`;
                } else if (task.fileType.startsWith('video/')) {
                    mediaHtml = `<video src="${task.mediaUrl}" class="media-preview" controls></video>`;
                } else {
                    if (currentUser === 'kangeswaran') {
                        mediaHtml = `<div style="margin-top: 10px;">
                            <p><b>இணைக்கப்பட்ட கோப்பு:</b> ${task.fileName}</p>
                            <a href="${task.mediaUrl}" download="${task.fileName}" class="download-btn">கோப்பைப் பதிவிறக்கவும்</a>
                        </div>`;
                    } else {
                        mediaHtml = `<div style="margin-top: 10px; color: var(--secondary); font-size: 14px;">
                            <p>📎 ஆவணம் இணைக்கப்பட்டுள்ளது: ${task.fileName}</p>
                        </div>`;
                    }
                }
            }

            let editBtnHtml = '';
            if (task.user === currentUser || currentUser === 'kangeswaran') {
                editBtnHtml = `<button onclick="editTask(${task.id})" style="padding: 6px 12px; font-size: 12px; margin-top: 10px; background-color: var(--secondary);">மாற்றுக / அப்டேட் செய்க</button>`;
            }

            card.innerHTML = `
                <div class="task-header">
                    <span class="task-title">${task.title}</span>
                    <span class="badge badge-${task.status}">${badgeText}</span>
                </div>
                <p>${task.desc}</p>
                <small style="color: var(--secondary);">பணியாளர்: <b>${task.user}</b> | நேரம்: ${task.date}</small>
                <div>${mediaHtml}</div>
                <div>${editBtnHtml}</div>
            `;
            taskList.appendChild(card);
        });
    }
</script>

</body>
</html>
